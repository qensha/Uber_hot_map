<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <title>Uber Bay Area 热区 / 死区 + 时间热力图</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/leaflet@1.9.4/dist/leaflet.css" />
  <script src="https://cdn.jsdelivr.net/npm/leaflet@1.9.4/dist/leaflet.js"></script>

  <style>
    html, body {
      height: 100%;
      margin: 0;
      padding: 0;
    }
    #map {
      width: 100%;
      height: 100%;
    }

    /* UI 面板 */
    #ui-panel {
      position: absolute;
      z-index: 1000;
      top: 10px;
      left: 10px;
      background: rgba(255, 255, 255, 0.95);
      padding: 8px 10px;
      border-radius: 6px;
      box-shadow: 0 2px 6px rgba(0,0,0,0.3);
      font-size: 13px;
      max-width: 260px;
    }
  </style>
</head>
<body>

<div id="map"></div>

<div id="ui-panel">
  <h4>图层</h4>
  <div class="layer-toggles">
    <label><input type="checkbox" id="chk_hot" checked> HOT 热区（绿色）</label>
    <label><input type="checkbox" id="chk_dead" checked> DEAD 死区（红色）</label>
    <label><input type="checkbox" id="chk_premium" checked> PREMIUM 小费顶级（黄色）</label>
  </div>

  <hr>

  <h4>每日时间热力图</h4>
  <input type="range" id="time_slider" min="0" max="5" step="1" value="0">
  <div id="time_label"></div>
  <label><input type="checkbox" id="auto_time" checked> 自动跟随当前时间</label>
</div>

<script>
// ------------------ 1. 初始化地图 ------------------
var map = L.map('map', { center: [37.6, -122.1], zoom: 9 });

L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png')
  .addTo(map);

// ------------------ 2. 区域数据 ------------------
var zones = [
  { name: "SFO", category: "HOT", lat: 37.6213, lng: -122.379, radius_mi: 2 },
  { name: "San Jose Downtown", category: "HOT", lat: 37.3382, lng: -121.8863, radius_mi: 1.5 },
  { name: "Palo Alto", category: "HOT", lat: 37.4419, lng: -122.143, radius_mi: 2 },
  { name: "SFO Airport - Premium", category: "PREMIUM", lat: 37.615, lng: -122.39, radius_mi: 2.5 }
  // ……你的原始所有区域都可继续加进去……
];

function milesToMeters(mi) { return mi * 1609.34; }

// ------------------ 3. 建立图层 ------------------
var hotGroup = L.featureGroup().addTo(map);
var deadGroup = L.featureGroup().addTo(map);
var premiumGroup = L.featureGroup().addTo(map);

var allCircles = [];

zones.forEach(z => {
  var color = z.category === "HOT" ? "green" :
              z.category === "DEAD" ? "red" : "yellow";

  var circle = L.circle([z.lat, z.lng], {
    color, fillColor: color, fillOpacity: 0.35,
    radius: milesToMeters(z.radius_mi), weight: 3
  });

  circle.zoneName = z.name;
  circle.zoneCategory = z.category;

  if (z.category === "HOT") hotGroup.addLayer(circle);
  else if (z.category === "DEAD") deadGroup.addLayer(circle);
  else premiumGroup.addLayer(circle);

  allCircles.push(circle);
});

// ------------------ 4. 图层控制 ------------------
document.getElementById("chk_hot").onchange = e =>
  e.target.checked ? map.addLayer(hotGroup) : map.removeLayer(hotGroup);

document.getElementById("chk_dead").onchange = e =>
  e.target.checked ? map.addLayer(deadGroup) : map.removeLayer(deadGroup);

document.getElementById("chk_premium").onchange = e =>
  e.target.checked ? map.addLayer(premiumGroup) : map.removeLayer(premiumGroup);

// ------------------ 5. 时间热力逻辑 ------------------
var timeSlots = [
  { label: "00:00-05:00" },
  { label: "05:00-09:00" },
  { label: "09:00-15:00" },
  { label: "15:00-19:00" },
  { label: "19:00-23:00" },
  { label: "23:00-24:00" }
];

function applyHeat(slotIndex) {
  document.getElementById("time_label").textContent =
    timeSlots[slotIndex].label;

  allCircles.forEach(c => {
    c.setStyle({ fillOpacity: 0.1 + 0.1 * slotIndex });
  });
}

var timeSlider = document.getElementById("time_slider");
var autoTimeCheckbox = document.getElementById("auto_time");

timeSlider.oninput = () => {
  autoTimeCheckbox.checked = false;
  applyHeat(+timeSlider.value);
};

autoTimeCheckbox.onchange = () => {
  if (autoTimeCheckbox.checked) updateHeatByCurrentTime();
};

function updateHeatByCurrentTime() {
  var hour = new Date().getHours();
  var slot = hour < 5 ? 0 : hour < 9 ? 1 : hour < 15 ? 2 :
             hour < 19 ? 3 : hour < 23 ? 4 : 5;

  timeSlider.value = slot;
  applyHeat(slot);
}

updateHeatByCurrentTime();
setInterval(() => {
  if (autoTimeCheckbox.checked) updateHeatByCurrentTime();
}, 60000);

// ------------------ 6. GPS 自动定位 ------------------

var userMarker = null;
var userAccuracy = null;

// 持续追踪设备位置
map.locate({
  watch: true,
  enableHighAccuracy: true
});

// 成功定位
map.on("locationfound", function (e) {

  if (userMarker) map.removeLayer(userMarker);
  if (userAccuracy) map.removeLayer(userAccuracy);

  // 蓝点图标
  userMarker = L.circleMarker(e.latlng, {
    radius: 8,
    color: "#2A93EE",
    fillColor: "#2A93EE",
    fillOpacity: 1
  }).addTo(map);

  // 精度圈
  userAccuracy = L.circle(e.latlng, {
    radius: e.accuracy,
    color: "#136AEC",
    fillColor: "#136AEC",
    fillOpacity: 0.2
  }).addTo(map);

  // 第一次自动移动视图
  if (!map._userLocatedOnce) {
    map.setView(e.latlng, 14);
    map._userLocatedOnce = true;
  }
});

// 定位失败
map.on("locationerror", () => {
  alert("无法取得你的定位，请确认开启 GPS 与浏览器定位权限。");
});
</script>

</body>
</html>
