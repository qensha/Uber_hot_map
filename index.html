<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <title>Uber Bay Area 热区 / 死区 + 时间热力图</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <!-- Leaflet -->
  <link
    rel="stylesheet"
    href="https://cdn.jsdelivr.net/npm/leaflet@1.9.4/dist/leaflet.css"
  />
  <script src="https://cdn.jsdelivr.net/npm/leaflet@1.9.4/dist/leaflet.js"></script>

  <style>
    html, body {
      height: 100%;
      margin: 0;
      padding: 0;
    }
    #map {
      width: 100%;
      height: 100%;
    }

    /* UI 面板：图层开关 + 时间控件 */
    #ui-panel {
      position: absolute;
      z-index: 1000;
      top: 10px;
      left: 10px;
      background: rgba(255, 255, 255, 0.95);
      padding: 8px 10px;
      border-radius: 6px;
      box-shadow: 0 2px 6px rgba(0,0,0,0.3);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      font-size: 13px;
      max-width: 260px;
    }

    #ui-panel h4 {
      margin: 0 0 4px 0;
      font-size: 14px;
      font-weight: 600;
    }

    .layer-toggles label,
    .time-controls label {
      display: block;
      margin: 2px 0;
      cursor: pointer;
    }

    #time_slider {
      width: 100%;
    }

    #time_label {
      display: inline-block;
      margin-top: 4px;
      font-weight: 600;
    }

    .heat-scale {
      margin-top: 4px;
      font-size: 12px;
      color: #555;
    }
  </style>
</head>
<body>

<div id="map"></div>

<div id="ui-panel">
  <h4>图层</h4>
  <div class="layer-toggles">
    <label><input type="checkbox" id="chk_hot" checked> HOT 热区（绿色）</label>
    <label><input type="checkbox" id="chk_dead" checked> DEAD 死区（红色）</label>
    <label><input type="checkbox" id="chk_premium" checked> PREMIUM 小费顶级（黄色）</label>
  </div>

  <hr style="margin:6px 0;">

  <h4>每日时间热力图</h4>
  <div class="time-controls">
    <label for="time_slider">时间段（A：滑块模式）</label>
    <input type="range" id="time_slider" min="0" max="5" step="1" value="0">
    <div id="time_label"></div>

    <label style="margin-top:6px;">
      <input type="checkbox" id="auto_time" checked>
      B：自动跟随当前时间
    </label>

    <div class="heat-scale">
      热度等级：0 冷清 · 1 正常 · 2 繁忙 · 3 爆炸
    </div>
  </div>
</div>

<script>
  // ------------------ 1. 初始化地图 ------------------
  var map = L.map('map', {
    center: [37.6, -122.1],
    zoom: 9
  });

  L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
    attribution: 'Data © OpenStreetMap contributors'
  }).addTo(map);

  // ------------------ 2. 区域数据（HOT / DEAD / PREMIUM） ------------------
  // 半径单位：英里
  var zones = [
    // HOT 区域（绿色）
    {
      name: "SFO",
      category: "HOT",
      lat: 37.6213,
      lng: -122.379,
      radius_mi: 2.0,
      note: "无脑接，回程单极快"
    },
    {
      name: "San Jose Downtown",
      category: "HOT",
      lat: 37.3382,
      lng: -121.8863,
      radius_mi: 1.5,
      note: "周末夜间 Surge 高"
    },
    {
      name: "Palo Alto",
      category: "HOT",
      lat: 37.4419,
      lng: -122.143,
      radius_mi: 2.0,
      note: "短单多，小费好"
    },
    {
      name: "Half Moon Bay",
      category: "HOT",
      lat: 37.4636,
      lng: -122.4286,
      radius_mi: 3.0,
      note: "92 号公路常堵"
    },
    {
      name: "Downtown San Francisco Core",
      category: "HOT",
      lat: 37.789,
      lng: -122.401,
      radius_mi: 1.8,
      note: "金融区+Union Square+SoMa"
    },
    {
      name: "Fishermans Wharf & Pier 39",
      category: "HOT",
      lat: 37.808,
      lng: -122.417,
      radius_mi: 1.2,
      note: "渔人码头+Pier 39"
    },
    {
      name: "Mission & Castro Nightlife",
      category: "HOT",
      lat: 37.759,
      lng: -122.426,
      radius_mi: 1.4,
      note: "Mission/Castro 夜生活"
    },
    {
      name: "Marina & Cow Hollow",
      category: "HOT",
      lat: 37.8,
      lng: -122.438,
      radius_mi: 1.0,
      note: "高收入住宅+餐饮"
    },
    {
      name: "Oakland Downtown & Lake Merritt",
      category: "HOT",
      lat: 37.804,
      lng: -122.271,
      radius_mi: 1.6,
      note: "Oakland 市中心+湖区"
    },
    {
      name: "Jack London Square",
      category: "HOT",
      lat: 37.795,
      lng: -122.278,
      radius_mi: 0.9,
      note: "港口餐饮区"
    },
    {
      name: "UC Berkeley & Downtown Berkeley",
      category: "HOT",
      lat: 37.87,
      lng: -122.268,
      radius_mi: 1.2,
      note: "校园+商业"
    },
    {
      name: "Walnut Creek Downtown",
      category: "HOT",
      lat: 37.901,
      lng: -122.061,
      radius_mi: 1.3,
      note: "郊区热点"
    },
    {
      name: "Dublin–Pleasanton BART & Stoneridge Area",
      category: "HOT",
      lat: 37.699,
      lng: -121.93,
      radius_mi: 1.6,
      note: "通勤+购物"
    },
    {
      name: "SFO Airport",
      category: "HOT",
      lat: 37.615,
      lng: -122.39,
      radius_mi: 2.5,
      note: "大型机场需求"
    },
    {
      name: "Millbrae Transit & Hotel Strip",
      category: "HOT",
      lat: 37.598,
      lng: -122.386,
      radius_mi: 1.2,
      note: "交通枢纽+酒店带"
    },
    {
      name: "San Mateo & Bridgepointe",
      category: "HOT",
      lat: 37.563,
      lng: -122.325,
      radius_mi: 1.6,
      note: "办公+购物"
    },
    {
      name: "Palo Alto & Stanford Campus",
      category: "HOT",
      lat: 37.444,
      lng: -122.165,
      radius_mi: 1.8,
      note: "大学区"
    },
    {
      name: "Mountain View Castro Street",
      category: "HOT",
      lat: 37.393,
      lng: -122.078,
      radius_mi: 1.2,
      note: "商业街"
    },
    {
      name: "Googleplex Area",
      category: "HOT",
      lat: 37.422,
      lng: -122.084,
      radius_mi: 1.0,
      note: "园区通勤"
    },
    {
      name: "Sunnyvale Downtown",
      category: "HOT",
      lat: 37.368,
      lng: -122.036,
      radius_mi: 1.1,
      note: "商业+通勤"
    },
    {
      name: "Cupertino Apple Park & Infinite Loop",
      category: "HOT",
      lat: 37.3349,
      lng: -122.009,
      radius_mi: 1.3,
      note: "科技园区"
    },
    {
      name: "Santana Row & Valley Fair",
      category: "HOT",
      lat: 37.322,
      lng: -121.946,
      radius_mi: 1.2,
      note: "购物餐饮"
    },
    {
      name: "SJC Airport & Hotel Zone",
      category: "HOT",
      lat: 37.363,
      lng: -121.928,
      radius_mi: 2.0,
      note: "San Jose 机场"
    },
    {
      name: "Downtown San Jose (Expansion)",
      category: "HOT",
      lat: 37.335,
      lng: -121.89,
      radius_mi: 1.8,
      note: "市中心扩展"
    },
    {
      name: "Levis Stadium & Great America",
      category: "HOT",
      lat: 37.403,
      lng: -121.97,
      radius_mi: 1.4,
      note: "场馆活动"
    },

    // DEAD 区域（红色）
    {
      name: "Gilroy Far South",
      category: "DEAD",
      lat: 37.005,
      lng: -121.568,
      radius_mi: 5.0,
      note: "返程空驶"
    },
    {
      name: "Morgan Hill",
      category: "DEAD",
      lat: 37.13,
      lng: -121.654,
      radius_mi: 3.5,
      note: "需求少"
    },
    {
      name: "Santa Cruz & Capitola",
      category: "DEAD",
      lat: 36.974,
      lng: -122.03,
      radius_mi: 4.0,
      note: "跨山返程空"
    },
    {
      name: "Pacifica Coast",
      category: "DEAD",
      lat: 37.613,
      lng: -122.486,
      radius_mi: 3.0,
      note: "海岸单向"
    },
    {
      name: "Tracy & Mountain House",
      category: "DEAD",
      lat: 37.739,
      lng: -121.425,
      radius_mi: 4.5,
      note: "远离主城"
    },
    {
      name: "Brentwood & Oakley",
      category: "DEAD",
      lat: 37.93,
      lng: -121.695,
      radius_mi: 3.8,
      note: "边缘通勤"
    },
    {
      name: "Antioch & Pittsburg",
      category: "DEAD",
      lat: 38.005,
      lng: -121.806,
      radius_mi: 4.0,
      note: "低密度"
    },
    {
      name: "Napa Valley Towns",
      category: "DEAD",
      lat: 38.297,
      lng: -122.287,
      radius_mi: 4.5,
      note: "旅游返程弱"
    },

    // PREMIUM 叠加区域（黄色）
    {
      name: "Palo Alto / Stanford / Menlo Park - Premium",
      category: "PREMIUM",
      lat: 37.444,
      lng: -122.165,
      radius_mi: 2.0,
      note: "综合单价+小费第一"
    },
    {
      name: "San Francisco Downtown (FiDi–SoMa) - Premium",
      category: "PREMIUM",
      lat: 37.789,
      lng: -122.401,
      radius_mi: 1.7,
      note: "FiDi+SoMa 高单价"
    },
    {
      name: "Mountain View / Sunnyvale Tech Corridor - Premium",
      category: "PREMIUM",
      lat: 37.385,
      lng: -122.041,
      radius_mi: 2.0,
      note: "科技公司通勤带"
    },
    {
      name: "Santana Row & Valley Fair - Premium",
      category: "PREMIUM",
      lat: 37.322,
      lng: -121.946,
      radius_mi: 1.3,
      note: "夜生活+购物爆点"
    },
    {
      name: "SFO Airport - Premium",
      category: "PREMIUM",
      lat: 37.615,
      lng: -122.39,
      radius_mi: 2.5,
      note: "长途机场单"
    }
  ];

  function milesToMeters(mi) {
    return mi * 1609.34;
  }

  // ------------------ 3. 建立图层与圆圈对象 ------------------
  var hotGroup = L.featureGroup().addTo(map);
  var deadGroup = L.featureGroup().addTo(map);
  var premiumGroup = L.featureGroup().addTo(map);

  var allCircles = []; // 用于时间热力调整

  zones.forEach(function (z) {
    var color = "green";
    if (z.category === "DEAD") color = "red";
    if (z.category === "PREMIUM") color = "yellow";

    var circle = L.circle([z.lat, z.lng], {
      color: color,
      fillColor: color,
      fillOpacity: 0.35,
      radius: milesToMeters(z.radius_mi),
      weight: 3
    });

    var popupHtml =
      "<b>" + z.name + "</b><br>" +
      (z.note ? z.note + "<br>" : "") +
      "半径: " + z.radius_mi.toFixed(1) + " mi";

    circle.bindPopup(popupHtml);
    circle.zoneName = z.name;
    circle.zoneCategory = z.category;

    if (z.category === "HOT") circle.addTo(hotGroup);
    else if (z.category === "DEAD") circle.addTo(deadGroup);
    else if (z.category === "PREMIUM") circle.addTo(premiumGroup);

    allCircles.push(circle);
  });

  // ------------------ 4. 图层开关（HOT / DEAD / PREMIUM） ------------------
  document.getElementById("chk_hot").addEventListener("change", function (e) {
    if (e.target.checked) map.addLayer(hotGroup);
    else map.removeLayer(hotGroup);
  });

  document.getElementById("chk_dead").addEventListener("change", function (e) {
    if (e.target.checked) map.addLayer(deadGroup);
    else map.removeLayer(deadGroup);
  });

  document.getElementById("chk_premium").addEventListener("change", function (e) {
    if (e.target.checked) map.addLayer(premiumGroup);
    else map.removeLayer(premiumGroup);
  });

  // ------------------ 5. 时间热力配置（A+B 两种模式共用） ------------------
  var timeSlots = [
    { id: 0, label: "00:00-05:00", start_hour: 0, end_hour: 5 },
    { id: 1, label: "05:00-09:00", start_hour: 5, end_hour: 9 },
    { id: 2, label: "09:00-15:00", start_hour: 9, end_hour: 15 },
    { id: 3, label: "15:00-19:00", start_hour: 15, end_hour: 19 },
    { id: 4, label: "19:00-23:00", start_hour: 19, end_hour: 23 },
    { id: 5, label: "23:00-24:00", start_hour: 23, end_hour: 24 }
  ];

  // 每个区域的时间热力曲线（0–3）
  var zoneHeatProfiles = {
    "Palo Alto / Stanford / Menlo Park - Premium": {
      weekday: [0, 2, 2, 2, 1, 0],
      weekend: [0, 1, 2, 2, 2, 0]
    },
    "San Francisco Downtown (FiDi–SoMa) - Premium": {
      weekday: [1, 3, 3, 3, 2, 1],
      weekend: [0, 1, 2, 2, 3, 2]
    },
    "Mountain View / Sunnyvale Tech Corridor - Premium": {
      weekday: [0, 2, 3, 2, 1, 0],
      weekend: [0, 1, 1, 1, 1, 0]
    },
    "Santana Row & Valley Fair - Premium": {
      weekday: [0, 1, 1, 2, 3, 2],
      weekend: [0, 1, 2, 3, 3, 2]
    },
    "SFO Airport - Premium": {
      weekday: [2, 3, 2, 2, 2, 2],
      weekend: [2, 3, 2, 2, 2, 2]
    },
    // 把 PREMIUM 的模式同步到相关 HOT 区域
    "Palo Alto": {
      weekday: [0, 2, 2, 2, 1, 0],
      weekend: [0, 1, 2, 2, 2, 0]
    },
    "Palo Alto & Stanford Campus": {
      weekday: [0, 2, 2, 2, 1, 0],
      weekend: [0, 1, 2, 2, 2, 0]
    },
    "Downtown San Francisco Core": {
      weekday: [1, 3, 3, 3, 2, 1],
      weekend: [0, 1, 2, 2, 3, 2]
    },
    "Mountain View Castro Street": {
      weekday: [0, 2, 3, 2, 1, 0],
      weekend: [0, 1, 1, 1, 1, 0]
    },
    "Googleplex Area": {
      weekday: [0, 2, 3, 2, 1, 0],
      weekend: [0, 1, 1, 1, 1, 0]
    },
    "Sunnyvale Downtown": {
      weekday: [0, 2, 3, 2, 1, 0],
      weekend: [0, 1, 1, 1, 1, 0]
    },
    "Santana Row & Valley Fair": {
      weekday: [0, 1, 1, 2, 3, 2],
      weekend: [0, 1, 2, 3, 3, 2]
    },
    "SFO Airport": {
      weekday: [2, 3, 2, 2, 2, 2],
      weekend: [2, 3, 2, 2, 2, 2]
    },
    "SJC Airport & Hotel Zone": {
      weekday: [1, 2, 2, 2, 2, 1],
      weekend: [1, 2, 2, 2, 2, 1]
    },
    "Downtown San Jose (Expansion)": {
      weekday: [0, 2, 2, 2, 2, 1],
      weekend: [0, 1, 2, 2, 3, 2]
    },
    "San Jose Downtown": {
      weekday: [0, 2, 2, 2, 2, 1],
      weekend: [0, 1, 2, 2, 3, 2]
    },
    "Gilroy Far South": {
      weekday: [0, 1, 1, 1, 0, 0],
      weekend: [0, 1, 1, 1, 0, 0]
    }
  };

  function getHeat(zoneName, isWeekend, slotIndex) {
    var profile = zoneHeatProfiles[zoneName];
    if (!profile) return 1; // 没有配置就当作“正常”
    var arr = isWeekend ? profile.weekend : profile.weekday;
    return arr[slotIndex] != null ? arr[slotIndex] : 1;
  }

  function findSlotIndexByHour(hour) {
    for (var i = 0; i < timeSlots.length; i++) {
      var s = timeSlots[i];
      if (hour >= s.start_hour && hour < s.end_hour) return i;
    }
    return 0;
  }

  function applyHeat(slotIndex, useCurrentTime) {
    var now = new Date();
    var day = now.getDay(); // 0=Sun, 6=Sat
    var isWeekend = (day === 0 || day === 6);

    if (useCurrentTime) {
      slotIndex = findSlotIndexByHour(now.getHours());
      document.getElementById("time_slider").value = slotIndex;
    }

    var slot = timeSlots[slotIndex];
    var label = slot.label + (useCurrentTime ? "（当前时间）" : "");
    document.getElementById("time_label").textContent = label;

    // 通过热度调节填充透明度
    allCircles.forEach(function (c) {
      var heat = getHeat(c.zoneName, isWeekend, slotIndex);
      var baseOpacity = 0.10;
      var maxExtra = 0.35;
      var opacity;
      if (heat === 0) {
        opacity = 0.04;
      } else {
        opacity = baseOpacity + (heat / 3) * maxExtra;
      }
      c.setStyle({ fillOpacity: opacity });
    });
  }

  // ------------------ 6. 绑定 A/B 控件事件 ------------------
  var timeSlider = document.getElementById("time_slider");
  var autoTimeCheckbox = document.getElementById("auto_time");

  timeSlider.addEventListener("input", function () {
    // 用户手动拖动滑块 → 关闭自动模式
    autoTimeCheckbox.checked = false;
    applyHeat(parseInt(timeSlider.value, 10), false);
  });

  autoTimeCheckbox.addEventListener("change", function () {
    applyHeat(parseInt(timeSlider.value, 10), autoTimeCheckbox.checked);
  });

  // 初始：按当前时间应用一次
  applyHeat(0, true);

  // 每分钟刷新一次（仅在自动模式下生效）
  setInterval(function () {
    if (autoTimeCheckbox.checked) {
      applyHeat(0, true);
    }
  }, 60000);
  
  // ------------------ 7. GPS 自动定位（新增） ------------------
  var userMarker = null;
  var userAccuracy = null;

  map.locate({
    watch: true,
    enableHighAccuracy: true
  });

  map.on("locationfound", function (e) {
    if (userMarker) map.removeLayer(userMarker);
    if (userAccuracy) map.removeLayer(userAccuracy);

    userMarker = L.circleMarker(e.latlng, {
      radius: 8,
      color: "#2A93EE",
      fillColor: "#2A93EE",
      fillOpacity: 1
    }).addTo(map);

    userAccuracy = L.circle(e.latlng, {
      radius: e.accuracy,
      color: "#136AEC",
      fillColor: "#136AEC",
      fillOpacity: 0.2
    }).addTo(map);

    if (!map._userLocatedOnce) {
      map.setView(e.latlng, 14);
      map._userLocatedOnce = true;
    }
  });

  map.on("locationerror", function () {
    alert("无法取得定位，请检查 GPS 是否开启并允许浏览器定位权限。");
  });

</script>

</body>
</html>
