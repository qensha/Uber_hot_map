<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <title>Uber Bay Area 热区 / 死区 + 时间热力图</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <!-- Leaflet -->
  <link
    rel="stylesheet"
    href="https://cdn.jsdelivr.net/npm/leaflet@1.9.4/dist/leaflet.css"
  />
  <script src="https://cdn.jsdelivr.net/npm/leaflet@1.9.4/dist/leaflet.js"></script>

  <style>
    html, body {
      height: 100%;
      margin: 0;
      padding: 0;
    }
    #map {
      width: 100%;
      height: 100%;
    }

    /* UI 面板：图层开关 + 时间控件 */
    #ui-panel {
      position: absolute;
      z-index: 1000;
      top: 10px;
      left: 10px;
      background: rgba(255, 255, 255, 0.95);
      padding: 8px 10px;
      border-radius: 6px;
      box-shadow: 0 2px 6px rgba(0,0,0,0.3);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      font-size: 13px;
      max-width: 260px;
    }

    #ui-panel h4 {
      margin: 0 0 4px 0;
      font-size: 14px;
      font-weight: 600;
    }

    .layer-toggles label,
    .time-controls label {
      display: block;
      margin: 2px 0;
      cursor: pointer;
    }

    #time_slider {
      width: 100%;
    }

    #time_label {
      display: inline-block;
      margin-top: 4px;
      font-weight: 600;
    }

    .heat-scale {
      margin-top: 4px;
      font-size: 12px;
      color: #555;
    }
  </style>
</head>
<body>

<div id="map"></div>

<div id="ui-panel">
  <h4>图层</h4>
  <div class="layer-toggles">
    <label><input type="checkbox" id="chk_hot" checked> HOT 热区（绿色）</label>
    <label><input type="checkbox" id="chk_dead" checked> DEAD 死区（红色）</label>
    <label><input type="checkbox" id="chk_premium" checked> PREMIUM 小费顶级（黄色）</label>
  </div>

  <hr style="margin:6px 0;">

  <h4>每日时间热力图</h4>
  <div class="time-controls">
    <label for="time_slider">时间段（A：滑块模式）</label>
    <input type="range" id="time_slider" min="0" max="5" step="1" value="0">
    <div id="time_label"></div>

    <label style="margin-top:6px;">
      <input type="checkbox" id="auto_time" checked>
      B：自动跟随当前时间
    </label>

    <div class="heat-scale">
      热度等级：0 冷清 · 1 正常 · 2 繁忙 · 3 爆炸
    </div>
  </div>
</div>

<script>
  // ------------------ 1. 初始化地图 ------------------
  var map = L.map('map', {
    center: [37.6, -122.1],
    zoom: 9
  });

  L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
    attribution: 'Data © OpenStreetMap contributors'
  }).addTo(map);

  // ------------------ 2. 区域数据（HOT / DEAD / PREMIUM） ------------------
  // 半径单位：英里
  var zones = [
    // ……（你的区域数据保持不变，这里省略）……
  ];

  function milesToMeters(mi) {
    return mi * 1609.34;
  }

  // ------------------ 3. 建立图层与圆圈对象 ------------------
  var hotGroup = L.featureGroup().addTo(map);
  var deadGroup = L.featureGroup().addTo(map);
  var premiumGroup = L.featureGroup().addTo(map);

  var allCircles = []; // 用于时间热力调整

  zones.forEach(function (z) {
    var color = "green";
    if (z.category === "DEAD") color = "red";
    if (z.category === "PREMIUM") color = "yellow";

    var circle = L.circle([z.lat, z.lng], {
      color: color,
      fillColor: color,
      fillOpacity: 0.35,
      radius: milesToMeters(z.radius_mi),
      weight: 3
    });

    var popupHtml =
      "<b>" + z.name + "</b><br>" +
      (z.note ? z.note + "<br>" : "") +
      "半径: " + z.radius_mi.toFixed(1) + " mi";

    circle.bindPopup(popupHtml);
    circle.zoneName = z.name;
    circle.zoneCategory = z.category;

    if (z.category === "HOT") circle.addTo(hotGroup);
    else if (z.category === "DEAD") circle.addTo(deadGroup);
    else if (z.category === "PREMIUM") circle.addTo(premiumGroup);

    allCircles.push(circle);
  });

  // ------------------ 4. 图层开关 ------------------
  document.getElementById("chk_hot").addEventListener("change", function (e) {
    if (e.target.checked) map.addLayer(hotGroup);
    else map.removeLayer(hotGroup);
  });
  document.getElementById("chk_dead").addEventListener("change", function (e) {
    if (e.target.checked) map.addLayer(deadGroup);
    else map.removeLayer(deadGroup);
  });
  document.getElementById("chk_premium").addEventListener("change", function (e) {
    if (e.target.checked) map.addLayer(premiumGroup);
    else map.removeLayer(premiumGroup);
  });

  // ------------------ 5. 时间热力图逻辑（保持原样） ------------------
  var timeSlots = [
    { id: 0, label: "00:00-05:00", start_hour: 0, end_hour: 5 },
    { id: 1, label: "05:00-09:00", start_hour: 5, end_hour: 9 },
    { id: 2, label: "09:00-15:00", start_hour: 9, end_hour: 15 },
    { id: 3, label: "15:00-19:00", start_hour: 15, end_hour: 19 },
    { id: 4, label: "19:00-23:00", start_hour: 19, end_hour: 23 },
    { id: 5, label: "23:00-24:00", start_hour: 23, end_hour: 24 }
  ];

  var zoneHeatProfiles = {
    // ……（你的 heat profile 保持不变）……
  };

  function getHeat(zoneName, isWeekend, slotIndex) {
    var profile = zoneHeatProfiles[zoneName];
    if (!profile) return 1;
    var arr = isWeekend ? profile.weekend : profile.weekday;
    return arr[slotIndex] != null ? arr[slotIndex] : 1;
  }

  function findSlotIndexByHour(hour) {
    for (var i = 0; i < timeSlots.length; i++) {
      var s = timeSlots[i];
      if (hour >= s.start_hour && hour < s.end_hour) return i;
    }
    return 0;
  }

  function applyHeat(slotIndex, useCurrentTime) {
    var now = new Date();
    var day = now.getDay();
    var isWeekend = (day === 0 || day === 6);

    if (useCurrentTime) {
      slotIndex = findSlotIndexByHour(now.getHours());
      document.getElementById("time_slider").value = slotIndex;
    }

    var slot = timeSlots[slotIndex];
    var label = slot.label + (useCurrentTime ? "（当前时间）" : "");
    document.getElementById("time_label").textContent = label;

    allCircles.forEach(function (c) {
      var heat = getHeat(c.zoneName, isWeekend, slotIndex);
      var baseOpacity = 0.10;
      var maxExtra = 0.35;
      var opacity;
      if (heat === 0) opacity = 0.04;
      else opacity = baseOpacity + (heat / 3) * maxExtra;
      c.setStyle({ fillOpacity: opacity });
    });
  }

  // ------------------ 6. 时间控件事件 ------------------
  var timeSlider = document.getElementById("time_slider");
  var autoTimeCheckbox = document.getElementById("auto_time");

  timeSlider.addEventListener("input", function () {
    autoTimeCheckbox.checked = false;
    applyHeat(parseInt(timeSlider.value, 10), false);
  });

  autoTimeCheckbox.addEventListener("change", function () {
    applyHeat(parseInt(timeSlider.value, 10), autoTimeCheckbox.checked);
  });

  applyHeat(0, true);

  setInterval(function () {
    if (autoTimeCheckbox.checked) applyHeat(0, true);
  }, 60000);

  // ------------------ 设备 GPS 定位（整段已加入） ------------------
  var userMarker = null;
  var userAccuracy = null;

  map.locate({
    watch: true,
    enableHighAccuracy: true
  });

  map.on("locationfound", function (e) {
    if (userMarker) map.removeLayer(userMarker);
    if (userAccuracy) map.removeLayer(userAccuracy);

    userMarker = L.circleMarker(e.latlng, {
      radius: 8,
      color: "#2A93EE",
      fillColor: "#2A93EE",
      fillOpacity: 1
    }).addTo(map);

    userAccuracy = L.circle(e.latlng, {
      radius: e.accuracy,
      color: "#136AEC",
      fillColor: "#136AEC",
      fillOpacity: 0.2
    }).addTo(map);

    if (!map._userLocatedOnce) {
      map.setView(e.latlng, 14);
      map._userLocatedOnce = true;
    }
  });

  map.on("locationerror", function () {
    alert("无法取得你的定位，请确认：\n\n1. 已开启 GPS\n2. 已允许浏览器定位权限");
  });
</script>

</body>
</html>
